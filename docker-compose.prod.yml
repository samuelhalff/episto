# Swiss Mail — Production Containers
#
# Use the same env file for Compose interpolation and container runtime:
# SWISSMAIL_ENV_FILE=/etc/swissmail/production.env \
#   docker compose --env-file /etc/swissmail/production.env -f docker-compose.prod.yml up -d --build
# Required public routing values in that env file:
#   APP_PUBLIC_URL=https://your-public-host
#   CORS_ORIGIN=https://your-public-host[,https://other-host]
#   NEXT_PUBLIC_SITE_URL=https://your-public-host
#   NEXT_PUBLIC_API_URL=/api (or https://api.your-public-host)
# Optional proxy overrides:
#   PUBLIC_FRONTEND_SERVER_NAMES="your-public-host alt-host"
#   PUBLIC_TLS_CERT_NAME=your-public-host
# Standalone VPS topology: nginx terminates public HTTPS on 80/443.

x-runtime-env-file: &runtime-env-file
  env_file:
    - path: ${SWISSMAIL_ENV_FILE:-/etc/swissmail/production.env}
      required: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swissmail
      POSTGRES_PASSWORD: swissmail
      POSTGRES_DB: swissmail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissmail"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/swiss-mail;
      exit 0;
      "

  backend:
    <<: *runtime-env-file
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgres://swissmail:swissmail@postgres:5432/swissmail
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: swiss-mail
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ZEFIX_PROXY_BASE_URL: http://zefix-proxy:8081
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      zefix-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *runtime-env-file
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/workers/runner.js"]
    environment:
      DATABASE_URL: postgres://swissmail:swissmail@postgres:5432/swissmail
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: swiss-mail
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ZEFIX_PROXY_BASE_URL: http://zefix-proxy:8081
      NODE_ENV: production
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  zefix-proxy:
    <<: *runtime-env-file
    build:
      context: ./services/zefix-proxy
      dockerfile: Dockerfile
    environment:
      ZEFIX_PROXY_BIND: "0.0.0.0"
      ZEFIX_PROXY_PORT: "8081"
      ZEFIX_PROXY_TIMEOUT_MS: "10000"
      ZEFIX_BASE_URL: https://www.zefix.admin.ch
      ZEFIX_COMPANY_SEARCH_PATH: /ZefixPublicREST/api/v1/company/search
      ZEFIX_COMPANY_SEARCH_METHOD: POST
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is required}
        NEXT_PUBLIC_APP_ENV: production
        API_URL: http://backend:4000
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "5000:5000"
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/render-prod-proxy.sh:/etc/nginx/render-prod-proxy.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      PUBLIC_FRONTEND_SERVER_NAMES: ${PUBLIC_FRONTEND_SERVER_NAMES:-}
      PUBLIC_TLS_CERT_NAME: ${PUBLIC_TLS_CERT_NAME:-}
    command: ["/bin/sh", "/etc/nginx/render-prod-proxy.sh"]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:

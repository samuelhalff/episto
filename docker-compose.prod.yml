# Episto — Production Containers
#
# Use the same env file for Compose interpolation and container runtime:
# EPISTO_ENV_FILE=/etc/episto/production.env \
#   docker compose --env-file /etc/episto/production.env -f docker-compose.prod.yml up -d --build
# Required public routing values in that env file:
#   APP_PUBLIC_URL=https://your-public-host
#   CORS_ORIGIN=https://your-public-host[,https://other-host]
#   NEXT_PUBLIC_SITE_URL=https://your-public-host
#   NEXT_PUBLIC_API_URL=/api (or https://api.your-public-host)
# Optional proxy overrides:
#   PUBLIC_FRONTEND_SERVER_NAMES="your-public-host alt-host"
#   PUBLIC_TLS_CERT_NAME=your-public-host
# Standalone VPS topology: nginx terminates public HTTPS on 80/443 and also exposes
# a plain-http 5000 handoff for upstream edge proxies that forward local traffic.

x-runtime-env-file: &runtime-env-file
  env_file:
    - path: ${EPISTO_ENV_FILE:-/etc/episto/production.env}
      required: true

# Container hardening is applied inline on every service via `security_opt:
# [no-new-privileges:true]`. This prevents a process from gaining additional
# privileges through setuid/setgid binaries.
# NOTE: resource limits (mem_limit / cpus) are intentionally not hard-coded here
# because optimal values depend on host sizing — set them per deployment.

services:
  postgres:
    security_opt:
      - no-new-privileges:true
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-episto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-episto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-episto}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    security_opt:
      - no-new-privileges:true
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  minio:
    security_opt:
      - no-new-privileges:true
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  minio-provision:
    <<: *runtime-env-file
    profiles: ["manual"]
    security_opt:
      - no-new-privileges:true
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET};
      "
    networks:
      - internal

  backend:
    <<: *runtime-env-file
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-episto}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-episto}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-episto}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ZEFIX_PROXY_BASE_URL: http://zefix-proxy:8081
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    volumes:
      - /etc/episto/ga-sa.json:/run/secrets/episto-ga-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      zefix-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
      - proxy
    restart: unless-stopped

  worker:
    <<: *runtime-env-file
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/workers/runner.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-episto}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-episto}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-episto}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ZEFIX_PROXY_BASE_URL: http://zefix-proxy:8081
      NODE_ENV: production
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - internal
    restart: unless-stopped

  zefix-proxy:
    security_opt:
      - no-new-privileges:true
    build:
      context: ./services/zefix-proxy
      dockerfile: Dockerfile
    environment:
      ZEFIX_PROXY_BIND: "0.0.0.0"
      ZEFIX_PROXY_PORT: "8081"
      ZEFIX_PROXY_TIMEOUT_MS: "10000"
      ZEFIX_BASE_URL: https://www.zefix.admin.ch
      ZEFIX_COMPANY_SEARCH_PATH: /ZefixPublicREST/api/v1/company/search
      ZEFIX_COMPANY_SEARCH_METHOD: POST
      ZEFIX_USERNAME: ${ZEFIX_USERNAME:-}
      ZEFIX_PASSWORD: ${ZEFIX_PASSWORD:-}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
    restart: unless-stopped

  frontend:
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is required}
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        API_URL: http://backend:4000
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Server-side (RSC) calls to the backend on the shared proxy network — used
      # by getServicePriceBand to read the cached pricing snapshot for JSON-LD.
      API_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - proxy
    restart: unless-stopped

  proxy:
    security_opt:
      - no-new-privileges:true
    # nginx 1.27.5 + module brotli (nginx/Dockerfile.proxy)
    build:
      context: ./nginx
      dockerfile: Dockerfile.proxy
    image: episto-proxy:1.27.5-brotli
    ports:
      - "5000:5000"
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/render-prod-proxy.sh:/etc/nginx/render-prod-proxy.sh:ro
      - /var/lib/episto-www:/var/www:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Extra vhosts for other sites hosted on this VPS (e.g. guide-assurance.ch).
      # Files live on the host, outside this repo; see nginx/render-prod-proxy.sh.
      - /etc/episto/proxy-extra:/etc/nginx/extra.d:ro
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      PUBLIC_FRONTEND_SERVER_NAMES: ${PUBLIC_FRONTEND_SERVER_NAMES:-}
      PUBLIC_TLS_CERT_NAME: ${PUBLIC_TLS_CERT_NAME:-}
    command: ["/bin/sh", "/etc/nginx/render-prod-proxy.sh"]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - proxy
    restart: unless-stopped

networks:
  internal:
    # Backend, worker, and infrastructure — not reachable from the proxy
  proxy:
    # Proxy ↔ frontend ↔ backend only

volumes:
  pgdata:
  redisdata:
  miniodata:

# Swiss Mail — nginx reverse proxy configuration
#
# Production topology (Infomaniak):
#   - nginx handles TLS termination and reverse proxy
#   - frontend (Next.js) on localhost:3000
#   - backend (Fastify API) on localhost:4000
#
# Security headers — canonical values from docs/07-operations/security-and-privacy.md
# These duplicate application-level headers as defense in depth. If header values
# change, update BOTH this file and the application (Helmet/Next.js headers).

# ── Global ────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml
             application/xml application/xml+rss text/javascript;

  # Proxy timeouts
  proxy_connect_timeout 10s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;  # Allow 60s for SSE keep-alive intervals

  # ── Redirect HTTP → HTTPS ───────────────────────────────────────────────────

  server {
    listen 80;
    server_name swissmail.ch www.swissmail.ch api.swissmail.ch;

    location /.well-known/acme-challenge/ {
      root /var/www/html;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Frontend (swissmail.ch) ─────────────────────────────────────────────────

  server {
    listen 443 ssl http2;
    server_name swissmail.ch www.swissmail.ch;

    ssl_certificate     /etc/ssl/certs/swissmail.ch.crt;
    ssl_certificate_key /etc/ssl/private/swissmail.ch.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers — defense in depth alongside application-level headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # www → non-www redirect
    if ($host = www.swissmail.ch) {
      return 301 https://swissmail.ch$request_uri;
    }

    # Apple Pay domain verification — Stripe supplies the file content
    location = /.well-known/apple-developer-merchantid-domain-association {
      root /var/www/html;
      default_type application/octet-stream;
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── Backend API (api.swissmail.ch) ──────────────────────────────────────────

  server {
    listen 443 ssl http2;
    server_name api.swissmail.ch;

    ssl_certificate     /etc/ssl/certs/api.swissmail.ch.crt;
    ssl_certificate_key /etc/ssl/private/api.swissmail.ch.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SSE endpoints — disable buffering so events flow through immediately
    location ~ ^/api/v1/drafts/[^/]+/stream {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;  # Allow longer connection for SSE streams
      chunked_transfer_encoding on;
    }

    # Stripe webhook — allow larger body; no CSRF token needed (signature auth)
    location /api/v1/webhooks/stripe {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 1m;
    }

    # All other API routes
    location / {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 10m;  # Allow up to 10 MB for file uploads
    }
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name swissmail.ch www.swissmail.ch api.swissmail.ch;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name swissmail.ch www.swissmail.ch;

  # Expect a LetsEncrypt certificate bundle that covers swissmail.ch, www.swissmail.ch,
  # and api.swissmail.ch in the swissmail.ch live directory.
  ssl_certificate /etc/letsencrypt/live/swissmail.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/swissmail.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  if ($host = www.swissmail.ch) {
    return 301 https://swissmail.ch$request_uri;
  }

  client_max_body_size 50M;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Forwarded         "host=$host;proto=https";
  proxy_http_version 1.1;
  proxy_redirect off;

  location = /.well-known/apple-developer-merchantid-domain-association {
    root /var/www;
    default_type application/octet-stream;
  }

  location / {
    set $frontend_upstream http://frontend:3000;
    proxy_pass $frontend_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.swissmail.ch;

  ssl_certificate /etc/letsencrypt/live/swissmail.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/swissmail.ch/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 50M;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Forwarded         "host=$host;proto=https";
  proxy_http_version 1.1;
  proxy_redirect off;

  location ~ ^/api/v1/drafts/[^/]+/stream {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
  }

  location / {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

map $http_x_forwarded_host $forwarded_host {
  default $http_x_forwarded_host;
  '' $host;
}

map $http_x_forwarded_port $forwarded_port {
  default $http_x_forwarded_port;
  '' $server_port;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────

server {
  listen 80;
  server_name ark-fid.ddns.net;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── Docker DNS resolver (re-resolve on container recreation) ──────────────────

resolver 127.0.0.11 valid=10s ipv6=off;

# ── Plain HTTP handoff on localhost:5000 from the upstream host proxy ────────
# The upstream edge proxy must preserve Host and forward X-Forwarded-Proto,
# X-Forwarded-Host, and X-Forwarded-Port so absolute URLs stay on the public domain.

server {
  listen 5000;
  server_name ark-fid.ddns.net;

  client_max_body_size 50M;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host  $forwarded_host;
  proxy_set_header X-Forwarded-Port  $forwarded_port;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Forwarded         "host=$forwarded_host;proto=$forwarded_proto";
  proxy_http_version 1.1;
  proxy_redirect off;

  location ~ ^/api/v1/drafts/[^/]+/stream {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
  }

  location /api/ {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location / {
    set $frontend_upstream http://frontend:3000;
    proxy_pass $frontend_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ── Public HTTPS on 443 ───────────────────────────────────────────────────────

server {
  listen 443 ssl;
  listen 443 quic;
  http2 on;
  http3 on;
  server_name ark-fid.ddns.net;

  # TLS
  ssl_certificate /etc/letsencrypt/live/ark-fid.ddns.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ark-fid.ddns.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Advertise HTTP/3 support
  add_header Alt-Svc 'h3=":$server_port"; ma=86400' always;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml application/atom+xml
    image/svg+xml font/woff2;

  client_max_body_size 50M;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Forwarded         "host=$host;proto=https";
  proxy_http_version 1.1;
  proxy_redirect off;

  # SSE streams — disable buffering
  location ~ ^/api/v1/drafts/[^/]+/stream {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
  }

  # Backend API
  location /api/ {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Frontend (Next.js)
  location / {
    set $frontend_upstream http://frontend:3000;
    proxy_pass $frontend_upstream;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

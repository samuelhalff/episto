# Swiss Mail — Development Stack
#
# docker compose up -d       → starts everything (infra + app with hot reload)
# docker compose down        → stop (keeps data)
# docker compose down -v     → stop and delete volumes
#
# For production containers, see docker-compose.prod.yml

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: swissmail
      POSTGRES_PASSWORD: swissmail
      POSTGRES_DB: swissmail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissmail"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/swiss-mail;
      exit 0;
      "

  # ── Application (hot reload via volume mount) ─────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://swissmail:swissmail@postgres:5432/swissmail
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: swiss-mail
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CORS_ORIGIN: https://ark-fid.ddns.net,http://localhost:5000
      NODE_ENV: development
      PORT: "4000"
      ADDRESS_SEARCH_PROVIDER: ${ADDRESS_SEARCH_PROVIDER:-geo_admin}
      ADDRESS_SEARCH_TIMEOUT_MS: ${ADDRESS_SEARCH_TIMEOUT_MS:-8000}
      GEO_ADMIN_API_BASE_URL: ${GEO_ADMIN_API_BASE_URL:-https://api3.geo.admin.ch}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    command: >
      sh -c "
      npm run build -w shared 2>/dev/null &&
      npm run db:migrate:dev -w backend &&
      npm run dev -w backend
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://swissmail:swissmail@postgres:5432/swissmail
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: swiss-mail
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      NODE_ENV: development
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    command: npx tsx watch backend/src/workers/runner.ts
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  zefix-proxy:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      ZEFIX_PROXY_BIND: "0.0.0.0"
      ZEFIX_PROXY_PORT: "8081"
      ZEFIX_PROXY_TIMEOUT_MS: "10000"
      ZEFIX_BASE_URL: https://www.zefix.admin.ch
      ZEFIX_COMPANY_SEARCH_PATH: /ZefixPublicREST/api/v1/company/search
      ZEFIX_COMPANY_SEARCH_METHOD: POST
    command: node services/zefix-proxy/server.mjs
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/frontend/.next
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      NEXT_DIST_DIR: .next
      API_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SITE_URL: https://ark-fid.ddns.net
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      NEXT_PUBLIC_APP_ENV: development
    command: >
      sh -c "
      lock_hash=$$(sha256sum /app/package-lock.json | awk '{print $$1}');
      cache_hash=$$(cat /app/node_modules/.package-lock.sha256 2>/dev/null || true);
      if [ ! -d /app/node_modules/next ] || [ \"$$lock_hash\" != \"$$cache_hash\" ]; then
        cd /app &&
        npm ci --include=dev --no-fund --no-audit &&
        printf '%s' \"$$lock_hash\" > /app/node_modules/.package-lock.sha256;
      fi;
      find .next -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true;
      npm run dev
      "
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "5000:5000"
    volumes:
      - ./nginx/ark-fid-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  frontend_node_modules:
  frontend_next_cache:

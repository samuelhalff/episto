# Swiss Mail — Local Development Stack
# Usage:
#   docker compose up           → start infra services only (useful for local backend dev)
#   docker compose --profile app up   → start everything including backend/frontend/worker
#   docker compose down -v      → stop and remove volumes
#
# Application services (backend, frontend, worker) require building first:
#   docker compose --profile app build
#
# Non-default configuration (API keys, etc.) goes in .env (copy from .env.example).
# Infrastructure services start without a .env file.

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: swissmail
      POSTGRES_PASSWORD: swissmail
      POSTGRES_DB: swissmail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissmail"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/swiss-mail;
      exit 0;
      "

  # ── Application services (profile: app) ──────────────────────────────────
  # Start with: docker compose --profile app up

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://swissmail:swissmail@postgres:5432/swissmail
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: swiss-mail
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
      PORT: "4000"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Override the default CMD to run only the BullMQ worker runner
    command: ["node", "dist/workers/runner.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://swissmail:swissmail@postgres:5432/swissmail
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: swiss-mail
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      NODE_ENV: development
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
        NEXT_PUBLIC_APP_ENV: development
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
